name: Release

# One-click release. Computes the next version and applies it to the extension
# and both npm packages in lockstep, tests, publishes to npm (core + cli) and
# the VS Code Marketplace, and only then pushes the release commit/tag and cuts
# the GitHub Release. Nothing is pushed to master until every publish succeeds,
# so a failure never leaves a stray version bump behind.
#
# Every publish step is idempotent: it checks whether the target already carries
# this version and skips instead of failing. A run that published to npm but
# died before the Marketplace (or before pushing the release commit) can simply
# be re-run — the finished targets are skipped, the unfinished ones complete,
# and finalize cuts the release. That is what keeps a half-published version
# from stranding master a version behind with no way forward but a manual fix.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch / minor / major)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# contents: write lets the final job push the release commit/tag and create the
# GitHub Release. id-token: write lets the npm publish job authenticate to npm
# via OIDC (Trusted Publishing) instead of a stored token.
permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve the version to release
        id: bump
        env:
          VERSION_BUMP: ${{ github.event.inputs.version }}
        run: |
          # A previous run may have published to some targets but failed before
          # pushing the version bump to master, leaving master a version behind
          # what is actually published. There are two distinct situations and
          # they want opposite handling:
          #
          #   - Partially published (live on some targets, not all): finish it.
          #     Re-releasing this same version lets the idempotent publish steps
          #     skip what is done and complete what is not.
          #   - Fully published everywhere: it is a completed release that only
          #     missed its git commit. Bump past it to get a fresh version.
          #
          # The old logic bumped past *any* version seen anywhere, which turned
          # a recoverable partial release into an abandoned one every time.

          on_npm() { npm view "$1@$2" version >/dev/null 2>&1; }

          # `vsce show` prints "  Version:            0.2.1   " — the label is
          # indented and the value carries trailing spaces, so both ends must be
          # trimmed or the comparison silently never matches.
          marketplace_version() {
            npx --yes @vscode/vsce show jubinsoni.foundry-trace-inspector 2>/dev/null \
              | awk -F': +' '
                  tolower($1) ~ /^[[:space:]]*version[[:space:]]*$/ {
                    v=$2; gsub(/[[:space:]]+$/, "", v); print v; exit
                  }'
          }

          MKT="$(marketplace_version)"

          # How many of the three targets already carry version $1?
          published_count() {
            local v="$1" n=0
            on_npm foundry-trace-inspector-core "$v" && n=$((n + 1))
            on_npm foundry-trace-inspector-cli  "$v" && n=$((n + 1))
            [ "$MKT" = "$v" ] && n=$((n + 1))
            echo "$n"
          }

          npm version "$VERSION_BUMP" --no-git-tag-version
          NEW_VERSION="$(node -p "require('./package.json').version")"

          # Skip over versions that are already fully released; stop on the
          # first that is free (count 0) or only partially published.
          while [ "$(published_count "$NEW_VERSION")" = "3" ]; do
            echo "Version ${NEW_VERSION} is fully published; bumping past it."
            npm version patch --no-git-tag-version
            NEW_VERSION="$(node -p "require('./package.json').version")"
          done

          COUNT="$(published_count "$NEW_VERSION")"
          if [ "$COUNT" != "0" ]; then
            echo "::notice::Resuming partially published release ${NEW_VERSION} (${COUNT}/3 targets already live); finished targets will be skipped."
          fi

          echo "Releasing ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          npm version "$NEW_VERSION" --no-git-tag-version --workspace foundry-trace-inspector-core
          npm version "$NEW_VERSION" --no-git-tag-version --workspace foundry-trace-inspector-cli
          node scripts/sync-core-dep-version.js "$NEW_VERSION"

          # Refresh the lockfile. The bumped ^version of core resolves to the
          # local workspace (not the registry), so this succeeds even though the
          # new version has not been published yet.
          npm install --package-lock-only --no-audit

      - name: Build the extension bundles
        run: npm run bundle && npm run bundle:web

      - name: Lint
        run: npm run lint

      - name: Package .vsix
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: npx --yes @vscode/vsce package --no-dependencies --out "foundry-trace-inspector-${VERSION}.vsix"

      - name: Upload bumped tree (manifests + lockfile) and the .vsix
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            packages/core/package.json
            packages/cli/package.json
            foundry-trace-inspector-*.vsix

  publish-npm:
    name: Publish to npm
    needs: prepare
    runs-on: ubuntu-latest
    # id-token: write is inherited from the top-level permissions; it lets npm
    # mint a short-lived OIDC credential for Trusted Publishing (no token).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) and provenance require npm >= 11.5.1, newer
      # than the npm bundled with Node 22. Pin the major so a future npm that
      # drops the current Node version can't break the release.
      - name: Upgrade npm for OIDC publishing
        run: npm install -g npm@11
      - run: npm ci

      - name: Apply the bumped manifests
        uses: actions/download-artifact@v5
        with:
          name: release-artifacts

      # Core first: the CLI depends on it. Auth is via OIDC — no NODE_AUTH_TOKEN.
      # Each publish is skipped when that exact version is already on the
      # registry, so re-running after a partial release is safe.
      - name: Publish core
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if npm view "foundry-trace-inspector-core@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::core@${VERSION} is already on npm; skipping."
          else
            npm publish --workspace foundry-trace-inspector-core --access public --provenance
          fi

      - name: Publish CLI
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if npm view "foundry-trace-inspector-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::cli@${VERSION} is already on npm; skipping."
          else
            npm publish --workspace foundry-trace-inspector-cli --access public --provenance
          fi

  publish-vscode:
    name: Publish the VS Code extension
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-artifacts
      # Skipped when the Marketplace already serves this version, so a re-run
      # after a partial release does not fail with "already exists".
      - name: Publish the packaged .vsix to the Marketplace
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT_JS }}
        run: |
          LIVE="$(npx --yes @vscode/vsce show jubinsoni.foundry-trace-inspector 2>/dev/null \
                   | awk -F': +' '
                       tolower($1) ~ /^[[:space:]]*version[[:space:]]*$/ {
                         v=$2; gsub(/[[:space:]]+$/, "", v); print v; exit
                       }')"
          if [ "$LIVE" = "$VERSION" ]; then
            echo "::notice::Marketplace already serves ${VERSION}; skipping."
          else
            npx --yes @vscode/vsce publish --no-dependencies --packagePath "foundry-trace-inspector-${VERSION}.vsix"
          fi

  finalize:
    name: Push release commit and create GitHub Release
    needs: [prepare, publish-npm, publish-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Apply the bumped manifests + collect the .vsix
        uses: actions/download-artifact@v5
        with:
          name: release-artifacts

      - name: Commit, tag, and push the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json packages/core/package.json packages/cli/package.json
          # A re-run against a master that already carries the bump has nothing
          # to commit; that is success, not failure.
          if git diff --cached --quiet; then
            echo "::notice::Manifests already at ${VERSION}; no release commit needed."
          else
            git commit -m "Release ${VERSION}"
          fi

          TAG="v${VERSION}"
          # Recreate a stale tag left by a previous failed run, if present.
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            git push origin --delete "${TAG}" || true
          fi
          git tag -fa "${TAG}" -m "Release ${VERSION}"
          git push --follow-tags origin HEAD:master

      - name: Extract this version's changelog notes
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Prefer a "## [x.y.z]" section; fall back to "## [Unreleased]".
          extract() {
            awk -v h="$1" '
              $0 ~ "^## \\[" h "\\]" {grab=1; next}
              grab && /^## \[/ {exit}
              grab {print}
            ' CHANGELOG.md
          }
          NOTES="$(extract "$VERSION")"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="$(extract "Unreleased")"
          fi
          # Drop the trailing "---" separator, then trailing blank lines.
          NOTES="$(printf '%s\n' "$NOTES" \
            | awk 'NR>1{print prev} {prev=$0} END{if (prev !~ /^-+$/) print prev}' \
            | awk '{lines[NR]=$0} END{last=NR; while (last>0 && lines[last] ~ /^[[:space:]]*$/) last--; for(i=1;i<=last;i++) print lines[i]}')"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then NOTES="Release v$VERSION"; fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo ""
            echo "**npm (core):** https://www.npmjs.com/package/foundry-trace-inspector-core/v/$VERSION"
            echo "**npm (cli):** https://www.npmjs.com/package/foundry-trace-inspector-cli/v/$VERSION"
            echo "**VS Code Marketplace:** https://marketplace.visualstudio.com/items?itemName=jubinsoni.foundry-trace-inspector"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          TAG="v$VERSION"
          VSIX="foundry-trace-inspector-${VERSION}.vsix#Foundry Trace Inspector (.vsix)"
          # Update in place if a previous run already cut this release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} exists; updating notes and asset."
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              "$VSIX"
          fi
