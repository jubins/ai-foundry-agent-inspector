name: Release

# One-click release. Computes the next version and applies it to the extension
# and both npm packages in lockstep, tests, publishes to npm (core + cli) and
# the VS Code Marketplace, and only then pushes the release commit/tag and cuts
# the GitHub Release. Nothing is pushed to master until every publish succeeds,
# so a failure never leaves a stray version bump behind.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch / minor / major)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# contents: write lets the final job push the release commit/tag and create the
# GitHub Release. id-token: write lets the npm publish job authenticate to npm
# via OIDC (Trusted Publishing) instead of a stored token.
permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply version bump to all manifests (working tree only)
        id: bump
        env:
          VERSION_BUMP: ${{ github.event.inputs.version }}
        run: |
          npm version "$VERSION_BUMP" --no-git-tag-version
          NEW_VERSION="$(node -p "require('./package.json').version")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          npm version "$NEW_VERSION" --no-git-tag-version --workspace foundry-trace-inspector-core
          npm version "$NEW_VERSION" --no-git-tag-version --workspace foundry-trace-inspector-cli
          node scripts/sync-core-dep-version.js "$NEW_VERSION"

          # Refresh the lockfile. The bumped ^version of core resolves to the
          # local workspace (not the registry), so this succeeds even though the
          # new version has not been published yet.
          npm install --package-lock-only --no-audit

      - name: Build the extension bundles
        run: npm run bundle && npm run bundle:web

      - name: Lint
        run: npm run lint

      - name: Package .vsix
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: npx --yes @vscode/vsce package --no-dependencies --out "foundry-trace-inspector-${VERSION}.vsix"

      - name: Upload bumped tree (manifests + lockfile) and the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            packages/core/package.json
            packages/cli/package.json
            foundry-trace-inspector-*.vsix

  publish-npm:
    name: Publish to npm
    needs: prepare
    runs-on: ubuntu-latest
    # id-token: write is inherited from the top-level permissions; it lets npm
    # mint a short-lived OIDC credential for Trusted Publishing (no token).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) and provenance require npm >= 11.5.1, newer
      # than the npm bundled with Node 22. Pin the major so a future npm that
      # drops the current Node version can't break the release.
      - name: Upgrade npm for OIDC publishing
        run: npm install -g npm@11
      - run: npm ci

      - name: Apply the bumped manifests
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      # Core first: the CLI depends on it. Auth is via OIDC — no NODE_AUTH_TOKEN.
      - name: Publish core
        run: npm publish --workspace foundry-trace-inspector-core --access public --provenance
      - name: Publish CLI
        run: npm publish --workspace foundry-trace-inspector-cli --access public --provenance

  publish-vscode:
    name: Publish the VS Code extension
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Publish the packaged .vsix to the Marketplace
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT_JS }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath "foundry-trace-inspector-${VERSION}.vsix"

  finalize:
    name: Push release commit and create GitHub Release
    needs: [prepare, publish-npm, publish-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Apply the bumped manifests + collect the .vsix
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Commit, tag, and push the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json packages/core/package.json packages/cli/package.json
          git commit -m "Release ${VERSION}"

          TAG="v${VERSION}"
          # Recreate a stale tag left by a previous failed run, if present.
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            git push origin --delete "${TAG}" || true
          fi
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push --follow-tags origin HEAD:master

      - name: Extract this version's changelog notes
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Prefer a "## [x.y.z]" section; fall back to "## [Unreleased]".
          extract() {
            awk -v h="$1" '
              $0 ~ "^## \\[" h "\\]" {grab=1; next}
              grab && /^## \[/ {exit}
              grab {print}
            ' CHANGELOG.md
          }
          NOTES="$(extract "$VERSION")"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="$(extract "Unreleased")"
          fi
          # Drop the trailing "---" separator, then trailing blank lines.
          NOTES="$(printf '%s\n' "$NOTES" \
            | awk 'NR>1{print prev} {prev=$0} END{if (prev !~ /^-+$/) print prev}' \
            | awk '{lines[NR]=$0} END{last=NR; while (last>0 && lines[last] ~ /^[[:space:]]*$/) last--; for(i=1;i<=last;i++) print lines[i]}')"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then NOTES="Release v$VERSION"; fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo ""
            echo "**npm (core):** https://www.npmjs.com/package/foundry-trace-inspector-core/v/$VERSION"
            echo "**npm (cli):** https://www.npmjs.com/package/foundry-trace-inspector-cli/v/$VERSION"
            echo "**VS Code Marketplace:** https://marketplace.visualstudio.com/items?itemName=jubinsoni.foundry-trace-inspector"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          TAG="v$VERSION"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            "foundry-trace-inspector-${VERSION}.vsix#Foundry Trace Inspector (.vsix)"
